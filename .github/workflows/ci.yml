name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest moved to 26.04 (2026-10-19), which has no Python 3.9 build;
    # 3.9 is still the declared minimum, so stay on 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -c "from clarifindata import Client, __version__; print(__version__)"
